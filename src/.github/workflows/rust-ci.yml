name: Rust
on:
          push:
                    branches:
                              [ main ,developpement]
          pull_request:
                    branches:
                              [ main , developpement]
env:
          CARGO_TERM_COLOR: always
jobs:
          build:
                    runs-on: ubuntu-24.04
                    steps:
                              - uses: actions/checkout@v3
                              - uses: actions-rs/toolchain@v1
                              - name: Build
                                run: cargo build --verbose
                              - name: Run tests
                                run: cargo test --verbose